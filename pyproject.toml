[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l1-support-agent"
version = "0.1.0"
description = "AI-агент первой линии техподдержки: триаж, база знаний, эскалации, баг-репорты"
requires-python = ">=3.11"
# Обращений к LLM в коде нет: модель приходит из харнесса (Claude Code),
# а MCP-серверы и метрики полностью детерминированы. Поэтому SDK Anthropic
# в зависимостях не значится - заявлено ровно то, что используется.
dependencies = [
    "mcp>=1.2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

# Раскладка плоская (common/, mcp_servers/, eval/, scripts/), поэтому пакеты
# перечислены явно: авто-поиск setuptools на такой структуре падает с
# «Multiple top-level packages discovered». Устанавливается только common/ —
# остальное запускается как скрипты по пути.
[tool.setuptools]
packages = ["common"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100