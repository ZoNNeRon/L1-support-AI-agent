# и для потенциального тестирования системы.

l2_oncall:
  "Сеть и интернет":
    handle: "@net_admin"
    name: "Сетевой инженер"
    scope: "VPN, Wi-Fi, коммутаторы, доступность внутренних порталов"
  "Оборудование":
    handle: "@hw_support"
    name: "Специалист по оборудованию"
    scope: "Принтеры, мониторы, периферия, замена железа"
  "Доступ и авторизация":
    handle: "@idm_admin"
    name: "Админ"
    scope: "AD, SSO, 2FA, выдача прав"
  default:
    handle: "@duty_l2"
    name: "Дежурный инженер L2"
    scope: "Общая очередь второй линии"

dev_teams:
  "Ошибки в работе ПО":
    repo: "company/internal-portal"
    labels: [bug, from-support, needs-triage]
    assignee_hint: "@backend-team"

sla_minutes:
  Критический: 15
  Высокий: 60
  Средний: 240
  Низкий: 1440