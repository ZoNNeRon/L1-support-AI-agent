# Приоритет считается детерминированно: impact x urgency.
# LLM определяет ТОЛЬКО impact и urgency, само значение приоритета не выдумывает.
# Причина: в исходной очереди приоритеты проставлены случайно
# (напр. «Забыл пароль» = Критический), и повторять этот шум нельзя.
# Все данные, аналогично параллельным yaml, симулированы для последующей
# симуляции работы.

impact:
  single_user: 1  # затронут один сотрудник
  team: 2         # затронут отдел / кабинет
  org_wide: 3     # затронута вся компания или критичный бизнес-процесс

urgency:
  workaround: 1 # есть обходной путь, работа продолжается
  degraded: 2   # работать можно, но с потерями
  blocked: 3    # работа полностью остановлена

# score = impact * urgency
matrix:
  1: Низкий
  2: Низкий
  3: Средний
  4: Средний
  6: Высокий
  9: Критический

overrides:
  - if_signals: [утечк, безопасност, подозрительн, фишинг]
    priority: Критический
    reason: "Инцидент ИБ - эскалация вне очереди"
  - if_signals: [весь отдел, все сотрудники, вся компания]
    priority: Критический
    reason: "Массовое влияние заявлено пользователем явно"