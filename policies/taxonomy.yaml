# Данные перенесены по фактическим значениям из очереди mockapi.
# Агент обязан выбирать ТОЛЬКО из этих значений - свободный текст запрещён.

# signals вынесены по ключевым словам из сообщений пользователей
categories:
  - name: "Доступ и авторизация"
    signals: [пароль, логин, учетная запись, заблокирован, СМС, 2FA, права, доступ, авторизац]
    default_path: KB_RESOLVE
  - name: "Оборудование"
    signals: [принтер, монитор, клавиатура, мышь, мышка, сканер, компьютер, пищит, бумаг]
    default_path: KB_RESOLVE
  - name: "Сеть и интернет"
    signals: [интернет, wi-fi, wifi, vpn, сеть, портал, подключение, скорость]
    default_path: ESCALATE_L2
  - name: "Ошибки в работе ПО"
    signals: [ошибка 500, зависает, белый экран, time out, не сохран, не сходятся, криво, вылетает]
    default_path: BUG_REPORT
  - name: "Консультация"
    signals: [как, где, подскажите, инструкция, обучение, фильтр]
    default_path: KB_RESOLVE

priorities: ["Низкий", "Средний", "Высокий", "Критический"]

statuses: ["Новая", "В работе", "Ожидание ответа", "Решена", "Закрыта"]

# Маршруты, по которым закрывается обращение. Соответствуют реальным
# сценариям работы первой линии: решить самому, отдать L2, отдать разработке.
resolution_paths:
  KB_RESOLVE:   "Сценарий А - есть готовая инструкция в базе знаний, можно ответить сразу и закрыть тикет."
  ESCALATE_L2:  "Сценарий Б - инфраструктура, прав L1 не хватает, эскалация в Telegram."
  BUG_REPORT:   "Сценарий В - дефект ПО, необходимо завести Issue в GitHub и связать с тикетом."
  NEED_INFO:    "Данных недостаточно - уточняющий вопрос пользователю, тикет не закрывать."