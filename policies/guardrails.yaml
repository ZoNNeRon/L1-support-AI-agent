# Ограничения автономности. Агент - сотрудник, а не бесконтрольный скрипт.
# Все данные созданы только для демонстрации работы.

confidence:
  auto_close_min: 0.75 # ниже - ответ отправляем, но тикет не закрываем
  escalate_min: 0.60 # ниже - уходим в NEED_INFO вместо угадывания маршрута

grounding:
  # Ссылка на статью обязательна там, где ответ содержит РЕШЕНИЕ. Уведомление
  # о статусе («баг подтверждён, передан в разработку») и уточняющий вопрос
  # решения не содержат: требовать от них цитату означало бы запретить агенту
  # разговаривать с пользователем везде, кроме Сценария А.
  require_kb_citation_for: [solution]
  forbid_invented_steps: true

  # Эти виды ответа заявку не закрывают - у них нет решения, которое можно
  # проверить. Итог всё равно подводит человек или следующий шаг агента.
  non_closing_kinds: [status_update, clarification]

  # status_update разрешён только когда действие действительно выполнено:
  # заявка эскалирована или по ней заведён баг-репорт. Иначе «уведомление
  # о статусе» стало бы дырой, через которую уходит любой текст без источника.
  status_update_requires_action: [escalation, bug_report]

# Ключи для передачи тикета сотруднику
human_handoff:
  - "Признаки инцидента информационной безопасности"
  - "Пользователь явно просит живого человека"
  - "Третья итерация по одному тикету без результата"

# Персональные данные пользователя
pii:
  mask_in_logs: [пароль, password, token, ключ, логин]

# Дополнение 
kb_enrichment:
  new_article_status: draft
  min_resolutions_before_publish: 1